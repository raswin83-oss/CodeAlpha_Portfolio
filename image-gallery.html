<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B;
    --surface:#18191C;
    --ink:#F2F2EF;
    --muted:#9A9B96;
    --accent:#C9A227;
    --accent-soft:#2B2716;
    --border:#2A2B2E;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  header{
    padding:56px 6vw 24px;
    border-bottom:1px solid var(--border);
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,5vw,52px);
    letter-spacing:-0.01em;
  }
  header p{
    margin-top:10px;
    color:var(--muted);
    max-width:520px;
    font-size:15px;
  }
  .filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding:24px 6vw 0;
  }
  .filter-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:.2s ease;
  }
  .filter-btn:hover{border-color:var(--accent);}
  .filter-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#0A0A0B;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
    padding:28px 6vw 80px;
    perspective:1000px;
  }
  .card{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    aspect-ratio:4/5;
    cursor:pointer;
    background:var(--surface);
    border:1px solid var(--border);
    transform-style:preserve-3d;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease;
    will-change:transform;
  }
  .card:hover{
    box-shadow:0 24px 50px rgba(20,20,15,.18);
    z-index:5;
  }
  .card img{
    width:100%;height:100%;object-fit:cover;
    display:block;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), filter .5s ease;
    transform:translateZ(0);
  }
  .card:hover img{transform:scale(1.08) translateZ(20px);}
  .card .tag{
    position:absolute;
    left:10px;bottom:10px;
    background:rgba(23,24,26,.68);
    color:#fff;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    backdrop-filter:blur(4px);
    opacity:0;
    transform:translateY(6px);
    transition:.3s ease;
  }
  .card:hover .tag{opacity:1;transform:translateY(0);}
  .card.hidden{display:none;}

  /* Lightbox */
  .lightbox{
    position:fixed;inset:0;
    background:rgba(15,16,14,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:40px;
    perspective:1600px;
  }
  .lightbox.open{display:flex;}
  .lightbox figure{
    max-width:min(900px,90vw);
    max-height:80vh;
    text-align:center;
    animation:flipIn .5s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;
  }
  @keyframes flipIn{
    from{opacity:0; transform:rotateY(-25deg) scale(.9);}
    to{opacity:1; transform:rotateY(0) scale(1);}
  }
  .lightbox img{
    max-width:100%;
    max-height:70vh;
    border-radius:8px;
    box-shadow:0 40px 90px rgba(0,0,0,.55);
  }
  .lightbox figcaption{
    color:#EDEDE8;
    margin-top:16px;
    font-size:14px;
    letter-spacing:.03em;
  }
  .lb-close, .lb-prev, .lb-next{
    position:absolute;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:18px;
    transition:.2s ease;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover{background:rgba(255,255,255,.2);}
  .lb-close{top:24px;right:24px;}
  .lb-prev{left:24px;top:50%;transform:translateY(-50%);}
  .lb-next{right:24px;top:50%;transform:translateY(-50%);}
  @media(max-width:640px){
    .lb-prev,.lb-next{width:36px;height:36px;font-size:15px;}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">01 · Visual Archive</div>
  <h1>Frame</h1>
  <p>A small, quiet gallery. Filter by category, then click any image to step through it full-screen.</p>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <figure>
    <img id="lbImg" src="" alt="">
    <figcaption id="lbCaption"></figcaption>
  </figure>
  <button class="lb-next" id="lbNext" aria-label="Next">›</button>
</div>

];

const categories = ["All", ...new Set(photos.map(p => p.cat))];
const filtersEl = document.getElementById("filters");
const gridEl = document.getElementById("grid");
let activeCat = "All";
let visibleIndexes = [];
let currentLbIndex = 0;

function renderFilters(){
  filtersEl.innerHTML = categories.map(c =>
    `<button class="filter-btn ${c===activeCat?'active':''}" data-cat="${c}">${c}</button>`
  ).join("");
}

function renderGrid(){
  gridEl.innerHTML = photos.map((p,i) =>
    `<div class="card" data-index="${i}" data-cat="${p.cat}">
       <img src="${p.url}" alt="${p.title}" loading="lazy">
       <span class="tag">${p.cat}</span>
     </div>`
  ).join("");
  applyFilter();
}

function applyFilter(){
  visibleIndexes = [];
  document.querySelectorAll(".card").forEach(card=>{
    const match = activeCat === "All" || card.dataset.cat === activeCat;
    card.classList.toggle("hidden", !match);
    if(match) visibleIndexes.push(Number(card.dataset.index));
  });
}

filtersEl.addEventListener("click", e=>{
  const btn = e.target.closest(".filter-btn");
  if(!btn) return;
  activeCat = btn.dataset.cat;
  renderFilters();
  applyFilter();
});

const lightbox = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCaption = document.getElementById("lbCaption");

function openLightbox(index){
  currentLbIndex = index;
  const p = photos[index];
  lbImg.src = p.url.replace("w=800","w=1400");
  lbImg.alt = p.title;
  lbCaption.textContent = `${p.title} — ${p.cat}`;
  lightbox.classList.add("open");
}

function step(dir){
  const pos = visibleIndexes.indexOf(currentLbIndex);
  const nextPos = (pos + dir + visibleIndexes.length) % visibleIndexes.length;
  openLightbox(visibleIndexes[nextPos]);
}

gridEl.addEventListener("click", e=>{
  const card = e.target.closest(".card");
  if(!card || card.classList.contains("hidden")) return;
  openLightbox(Number(card.dataset.index));
});

document.getElementById("lbClose").onclick = ()=> lightbox.classList.remove("open");
document.getElementById("lbPrev").onclick = ()=> step(-1);
document.getElementById("lbNext").onclick = ()=> step(1);
lightbox.addEventListener("click", e=>{ if(e.target === lightbox) lightbox.classList.remove("open"); });

document.addEventListener("keydown", e=>{
  if(!lightbox.classList.contains("open")) return;
  if(e.key === "Escape") lightbox.classList.remove("open");
  if(e.key === "ArrowLeft") step(-1);
  if(e.key === "ArrowRight") step(1);
});

renderFilters();
renderGrid();

// 3D tilt: each card tilts toward the cursor while hovered (mouse devices only)
if(window.matchMedia("(hover: hover) and (pointer: fine)").matches){
  gridEl.addEventListener("mousemove", e=>{
    const card = e.target.closest(".card");
    if(!card) return;
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg) scale(1.02)`;
  });
  gridEl.addEventListener("mouseleave", e=>{
    document.querySelectorAll(".card").forEach(c => c.style.transform = "");
  }, true);
  gridEl.addEventListener("mouseout", e=>{
    const card = e.target.closest(".card");
    if(card && !card.contains(e.relatedTarget)) card.style.transform = "";
  });
}
</script>
